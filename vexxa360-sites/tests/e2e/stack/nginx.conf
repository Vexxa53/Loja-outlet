# Gateway mínimo no lugar do Kong do Supabase: remove o prefixo e roteia para cada serviço.
events {}
http {
  client_max_body_size 20m;
  server {
    listen 8000;
    location /auth/v1/    { proxy_pass http://auth:9999/;   proxy_set_header Host $host; }
    location /rest/v1/    { proxy_pass http://rest:3000/;   proxy_set_header Host $host; proxy_set_header Accept-Profile $http_accept_profile; }
    location /storage/v1/ { proxy_pass http://storage:5000/; proxy_set_header Host $host; }
  }
}
